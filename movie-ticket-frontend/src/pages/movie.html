<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The 100 - Movie Page</title>
    <link rel="stylesheet" href="../styles/movie.css" />
  </head>
  <body>
    <div class="movie-container">
      <h1 id="movie-title">The 100</h1>
      <p><strong>Rating:</strong> <span id="rating">8.5</span></p>
      <p><strong>Year:</strong> <span id="year">2010</span></p>
      <p><strong>Duration:</strong> <span id="duration">1h 30min</span></p>
      <p><strong>Language:</strong> <span id="language">English</span></p>

      <div class="trailer">
        <iframe
          width="560"
          height="315"
          src="https://www.youtube.com/embed/ia1Fbg96vL0"
          title="YouTube trailer"
          frameborder="0"
          allowfullscreen
        >
        </iframe>
      </div>

      <button id="playBtn">▶ Play Movie</button>

      <div id="videoModal" class="modal" style="display: none">
        <div class="modal-content">
          <video id="movieVideo" width="100%" controls>
            <source src="path_to_video.mp4" type="video/mp4" />
            Your browser does not support the video tag.
          </video>
          <button id="closeBtn">✖ Close</button>
        </div>
      </div>
    </div>

    <script>
      const playBtn = document.getElementById("playBtn");
      const closeBtn = document.getElementById("closeBtn");
      const videoModal = document.getElementById("videoModal");
      const movieVideo = document.getElementById("movieVideo");

      playBtn.addEventListener("click", () => {
        videoModal.style.display = "block";
        movieVideo.play();
      });

      closeBtn.addEventListener("click", () => {
        videoModal.style.display = "none";
        movieVideo.pause();
        movieVideo.currentTime = 0;
      });
    </script>
  </body>
</html>
