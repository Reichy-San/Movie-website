<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - MoviesHD</title>
    <link rel="stylesheet" href="../styles/auth.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Monoton&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="auth-container">
      <form class="auth-form" id="signupForm">
        <h2>Sign Up</h2>
        <input
          type="text"
          id="signupUsername"
          placeholder="Username"
          required
        />
        <input type="email" id="signupEmail" placeholder="Email" required />
        <input
          type="password"
          id="signupPassword"
          placeholder="Password"
          required
        />
        <button type="submit">Sign Up</button>
        <p>Already have an account? <a href="./login.html">Login</a></p>
        <p id="signupMessage" class="error-message"></p>
      </form>
    </div>

    <script>
      document
        .getElementById("signupForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const username = document.getElementById("signupUsername").value;
          const email = document.getElementById("signupEmail").value;
          const password = document.getElementById("signupPassword").value;
          const message = document.getElementById("signupMessage");

          if (username && email && password) {
            // Save user to localStorage (for simulation only)
            const user = { username, email, password };
            localStorage.setItem(email, JSON.stringify(user));
            message.textContent =
              "Account created successfully! Redirecting to login...";
            setTimeout(() => {
              window.location.href = "./login.html";
            }, 2000);
          } else {
            message.textContent = "Please fill in all fields";
          }
        });
    </script>
  </body>
</html>
